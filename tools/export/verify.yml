#
# The whole gate on every push and pull request: npm run verify (doctor, typecheck, reproducible
# ROM builds against roms/manifest.json, budgets and completion replays, conformance ROMs, every
# test tier including headless Chromium).
name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: no dependency code runs at install time. npm ci fails if package-lock.json
      # and package.json disagree and never rewrites the lock.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 5
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 8
      - run: npm run verify
        env:
          CYC_TEST_CONCURRENCY: "2"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-logs
          path: .tmp/verify/
          retention-days: 7
